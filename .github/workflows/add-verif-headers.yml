name: Add verification headers

on:
  push:
    branches:
      - coder/add-verif-headers

permissions:
  contents: write

jobs:
  add-headers:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/coder/add-verif-headers' && github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: coder/add-verif-headers
          fetch-depth: 0

      - name: Add headers
        run: python3 .github/scripts/add_verif_headers.py

      - name: Validate headers
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          missing = []
          bad = []
          for path in sorted(Path('verif').rglob('*.sv')) + sorted(Path('verif').rglob('*.svh')):
              lines = path.read_text(errors='ignore').splitlines()
              data = '\n'.join(lines[:35])
              if 'Copyright 2026 Avant Labs PVT LTD' not in data:
                  missing.append(str(path))
              if not lines or lines[0].strip() != '////////////////////////////////////////////////////////////////////////////////':
                  bad.append(str(path))
              if not any(line.startswith('//  Filename      :') and path.name in line for line in lines[:30]):
                  bad.append(str(path))
          if missing or bad:
              print('Missing headers:', missing)
              print('Bad headers:', bad)
              raise SystemExit(1)
          print('All SystemVerilog verification files have headers')
          PY

      - name: Commit generated headers
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/add-verif-headers.yml .github/scripts/add_verif_headers.py
          git add verif .github/workflows/add-verif-headers.yml .github/scripts/add_verif_headers.py
          if git diff --cached --quiet; then
            echo "No header changes to commit"
            exit 0
          fi
          git commit -m "Add verification file headers"
          git push origin HEAD:refs/heads/coder/add-verif-headers
